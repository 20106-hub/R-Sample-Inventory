<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>검체 랙 재고관리 — 연결 중</title>
  <style>
    body{font-family:-apple-system,"Malgun Gothic",sans-serif;background:#0f766e;color:#fff;
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .box{max-width:420px;text-align:center}
    h1{font-size:1.2rem;margin:0 0 8px}
    p{opacity:.9;font-size:.95rem;line-height:1.5}
    .spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:s 1s linear infinite;margin:16px auto}
    @keyframes s{to{transform:rotate(360deg)}}
    a.btn{display:inline-block;margin-top:14px;background:#fff;color:#0f766e;text-decoration:none;
      font-weight:700;padding:14px 22px;border-radius:12px;font-size:1rem}
    .err{background:rgba(0,0,0,.2);border-radius:12px;padding:16px;margin-top:14px;font-size:.9rem}
  </style>
</head>
<body>
  <div class="box">
    <h1>검체 랙 재고관리</h1>
    <div class="spin" id="spin"></div>
    <p id="msg">스캔 시스템으로 이동 중입니다…</p>
    <div id="box"></div>
  </div>

  <script>
    // url.txt 에 현재 서버(터널) 주소가 들어 있습니다. (PC의 시작.bat 이 자동으로 갱신)
    fetch('url.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (u) {
        u = (u || '').trim();
        if (!/^https?:\/\//.test(u)) throw new Error('bad url');
        var go = document.createElement('a');
        go.className = 'btn'; go.href = u; go.textContent = '지금 이동';
        document.getElementById('box').appendChild(go);
        setTimeout(function () { location.replace(u); }, 600);
      })
      .catch(function () {
        document.getElementById('spin').style.display = 'none';
        document.getElementById('msg').textContent = '서버 주소를 불러오지 못했습니다.';
        document.getElementById('box').innerHTML =
          '<div class="err">PC에서 <b>시작.bat</b> 이 실행 중인지 확인하세요.<br>' +
          '방금 PC를 켰다면 1~2분 뒤 다시 시도해 주세요.</div>';
      });
  </script>
</body>
</html>
